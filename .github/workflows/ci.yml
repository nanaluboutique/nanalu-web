name: CI

# When this workflow runs:
#  - on every pull request (the gate before merging)
#  - on every push to main (a final check after a merge lands)
on:
  pull_request:
  push:
    branches: [main]

# If you push again to the same branch/PR, cancel the previous run
# so we don't waste minutes on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format & build
    runs-on: ubuntu-latest # the fresh, "sterile" VM
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm # cache npm downloads between runs for speed

      - name: Install dependencies
        run: npm ci # clean, exact install from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the image
        run: docker build -t nanalu-web:ci .

      - name: Run the container
        run: docker run -d -p 3000:3000 --name nl-test nanalu-web:ci

      - name: Smoke test — wait for HTTP 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ]; then echo "Served 200 ✓"; exit 0; fi
            echo "waiting for container... attempt $i (got '$code')"
            sleep 2
          done
          echo "Container did not serve HTTP 200 in time"
          docker logs nl-test
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f nl-test
