name: CI

# When this workflow runs:
#  - on every pull request (the gate before merging)
#  - on every push to main (a final check after a merge lands)
on:
  pull_request:
  push:
    branches: [main]

# If you push again to the same branch/PR, cancel the previous run
# so we don't waste minutes on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format & build
    runs-on: ubuntu-latest # the fresh, "sterile" VM
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm # cache npm downloads between runs for speed

      - name: Install dependencies
        run: npm ci # clean, exact install from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
