# Local development database — PostgreSQL in a container.
#
# This is a DEV CONVENIENCE only (not used in production): it lets us run
# Postgres without installing it on the host. Start it with:
#     docker compose up -d
# and stop it with:
#     docker compose down
#
# The credentials below are local-only throwaways (this file is committed),
# NOT secrets. The real connection string lives in .env.local (gitignored).
services:
  db:
    image: postgres:17-alpine
    container_name: nanalu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanalu
      POSTGRES_PASSWORD: nanalu
      POSTGRES_DB: nanalu
    ports:
      - "5432:5432"
    # Lets `docker compose up -d --wait` (our `db:up`) block until Postgres
    # actually accepts connections — not just "container started" — so chained
    # commands (db:up && db:migrate) don't race a cold start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanalu -d nanalu"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - nanalu-db-data:/var/lib/postgresql/data

  # Throwaway database for the DB-integration tests (#60). Deliberately UNLIKE the
  # dev `db` above in two ways:
  #   - port 5433 (not 5432) so it can run ALONGSIDE the dev DB without clashing,
  #     and so a test run can never point at — or wipe — your dev data by accident.
  #   - NO named volume: its data lives only in the container, so `db:test:down`
  #     (which passes -v) discards it entirely. "Throwaway" in the literal sense.
  # Behind the `test` profile, so a plain `npm run db:up` still starts only `db`;
  # you get this one with `npm run db:test:up` (adds `--profile test`).
  db-test:
    image: postgres:17-alpine
    container_name: nanalu-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: nanalu
      POSTGRES_PASSWORD: nanalu
      POSTGRES_DB: nanalu_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanalu -d nanalu_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nanalu-db-data:
